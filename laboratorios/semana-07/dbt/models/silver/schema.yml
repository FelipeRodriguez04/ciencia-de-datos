version: 2
models:
  - name: silver_yellow_trips
    description: Viajes válidos y únicos por contenido del registro original.
    columns:
      - name: trip_key
        description: SHA-256 del JSON original; clave lógica del viaje.
        data_tests: [not_null, unique]
      - name: pickup_at
        data_tests: [not_null]
      - name: dropoff_at
        data_tests: [not_null]
      - name: source_file
        data_tests: [not_null]
      - name: source_row
        data_tests: [not_null]
  - name: silver_rejected_trips
    description: Registros con razón de rechazo en rejection_reasons.
  - name: silver_duplicate_trips
    description: Copias exactas de un registro válido que exceden duplicate_rank 1.
